# ==============================================================================
#  .github/workflows/ci.yml
#  Canny Edge Detection on RISC-V — CI Pipeline
#
#  Two jobs:
#
#  [1] build-and-test  (GitHub-hosted ubuntu-latest)
#        - Builds GoogleTest from source
#        - Caches the RISC-V toolchain (~/riscv-toolchain) keyed on:
#            runner OS + upstream toolchain HEAD commit (first 12 chars)
#          → cache auto-invalidates when the upstream toolchain changes
#          → cache is OS-namespaced so a macOS runner never gets a Linux hit
#        - Builds toolchain from source on cache miss (slow first run only)
#        - Installs QEMU via apt (qemu-user-static)
#        - Verifies toolchain binary after every restore or build
#        - Runs host-side GoogleTest suite  (make test)
#        - Cross-compiles the full pipeline (make canny_rv)
#        - Runs RVV equivalence tests on QEMU at VLEN 128/256/512
#        - Runs optimization sweep         (make sweep W=256 H=256 I=2 VLEN=256)
#
#  [2] verify-env  (self-hosted runner: riscv-dev — your WSL2 machine)
#        - Runs scripts/verify.sh against your actual local environment
#        - Confirms toolchain, QEMU, GoogleTest, Python, and RVV smoke test
#        - Only runs on push to main/polish (not PRs — machine may be offline)
#
#  Cache notes:
#    Toolchain key format:  riscv-toolchain-<OS>-<upstream-HEAD-12char>-v1
#    GoogleTest key format: googletest-<OS>-v1
#
#    If you change configure flags (--with-arch, --with-abi, --prefix), bump
#    the trailing -v<N> suffix on the toolchain key to force a clean rebuild.
#    The upstream-HEAD component handles upstream GCC/binutils changes
#    automatically without any manual bump.
#
# ==============================================================================

name: CI

on:
  push:
    branches: [main, polish]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==============================================================================
#  JOB 1 — build-and-test
#  Runs on GitHub-hosted runner. Full cross-compile + test pipeline.
# ==============================================================================
jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120        # toolchain build can take ~60-90 min on cold cache

    steps:

    # ── Checkout ──────────────────────────────────────────────────────────────
    - name: Checkout repository
      uses: actions/checkout@v4

    # ── System dependencies ───────────────────────────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          autoconf automake build-essential bison flex texinfo gperf libtool \
          patchutils bc git cmake ninja-build pkg-config \
          libglib2.0-dev libpixman-1-dev libslirp-dev \
          libmpc-dev libmpfr-dev libgmp-dev zlib1g-dev libexpat1-dev \
          qemu-user-static \
          python3 python3-pip

    # ── QEMU symlink (qemu-user-static installs as qemu-riscv64-static) ───────
    - name: Expose qemu-riscv64 on PATH
      run: |
        if command -v qemu-riscv64-static &>/dev/null && \
           ! command -v qemu-riscv64 &>/dev/null; then
          sudo ln -s "$(which qemu-riscv64-static)" /usr/local/bin/qemu-riscv64
        fi
        qemu-riscv64 --version

    # ── Toolchain cache key ───────────────────────────────────────────────────
    # Fetch the upstream toolchain HEAD commit once, outside the cache step,
    # so the same value is used for both the restore key and the build condition.
    # Using the upstream HEAD means the cache auto-invalidates when riscv-collab
    # merges new commits — no manual version bump needed for upstream changes.
    # For local configure-flag changes, bump the trailing -v<N> suffix instead.
    - name: Get riscv-gnu-toolchain HEAD commit
      id: tc_commit
      run: |
        COMMIT=$(git ls-remote https://github.com/riscv-collab/riscv-gnu-toolchain HEAD \
                 | cut -f1 | cut -c1-12)
        echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
        echo "Toolchain upstream HEAD: $COMMIT"

    # ── Toolchain cache ───────────────────────────────────────────────────────
    # Key includes:
    #   ${{ runner.os }}                         → "Linux" on ubuntu-latest
    #   ${{ steps.tc_commit.outputs.sha }}       → upstream HEAD (12 chars)
    #   -v1                                      → manual bust for flag changes
    #
    # This key is strictly more specific than the old bare "riscv-toolchain-v1",
    # so there is no collision with any previously saved cache entries.
    # Old entries will expire naturally after 7 days of inactivity.
    - name: Restore toolchain cache
      id: tc_cache
      uses: actions/cache@v4
      with:
        path: ~/riscv-toolchain
        key: riscv-toolchain-${{ runner.os }}-${{ steps.tc_commit.outputs.sha }}-v1

    # ── Diagnose cache state ──────────────────────────────────────────────────
    # Runs unconditionally on every job — provides observable evidence in logs
    # of whether the cache was restored and whether the binary is intact.
    # This is what made the original cache-key mismatch diagnosable.
    - name: Diagnose toolchain cache state
      run: |
        echo "cache-hit=${{ steps.tc_cache.outputs.cache-hit }}"
        echo "cache-key=riscv-toolchain-${{ runner.os }}-${{ steps.tc_commit.outputs.sha }}-v1"
        if [ -d "$HOME/riscv-toolchain/bin" ]; then
          echo "Toolchain bin/ exists — checking binary"
          du -sh "$HOME/riscv-toolchain"
          "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-g++" --version || \
            echo "WARNING: binary present but --version failed"
        else
          echo "Toolchain bin/ missing — will build from source"
        fi

    # ── Build toolchain (only on cache miss) ──────────────────────────────────
    # Condition: cache was not restored OR the g++ binary is not executable.
    # The second guard defends against a partial/corrupt cache being restored
    # (e.g. from a previous run that failed mid-build and was saved incomplete).
    - name: Build RISC-V GNU toolchain from source
      if: steps.tc_cache.outputs.cache-hit != 'true'
      run: |
        # Remove any leftover partial directory from a previous failed build
        rm -rf "$HOME/riscv-toolchain" "$HOME/riscv-gnu-toolchain"

        git clone --depth 1 --recursive --shallow-submodules \
          https://github.com/riscv-collab/riscv-gnu-toolchain \
          "$HOME/riscv-gnu-toolchain"
        cd "$HOME/riscv-gnu-toolchain"
        ./configure \
          --prefix="$HOME/riscv-toolchain" \
          --with-arch=rv64gcv \
          --with-abi=lp64d
        make -j$(nproc)

    # ── Add toolchain to PATH and verify ─────────────────────────────────────
    # Runs whether the toolchain was just built or was restored from cache.
    # This step is the mandatory gate: if it fails, the job fails immediately
    # with a clear error rather than propagating a broken toolchain silently.
    - name: Add toolchain to PATH
      run: echo "$HOME/riscv-toolchain/bin" >> "$GITHUB_PATH"

    - name: Verify toolchain binary exists
          run: |
            if [ ! -x "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-g++" ]; then
              echo "ERROR: toolchain binary missing after build/restore"
              echo "Possible causes:"
              echo "  1) The build step failed or was cancelled mid-way"
              echo "  2) A corrupt partial toolchain was restored from cache"
              echo "Fix: bump the cache key version suffix in ci.yml (-v1 -> -v2)"
              exit 1
            fi
            echo "Binary present and executable — OK"

    - name: Verify toolchain
      run: |
        riscv64-unknown-elf-g++ --version
        echo "int main(){return 0;}" > /tmp/tc_check.cpp
        riscv64-unknown-elf-g++ -march=rv64gcv -mabi=lp64d -static \
          /tmp/tc_check.cpp -o /tmp/tc_check
        file /tmp/tc_check
        echo "Toolchain OK"

    # ── GoogleTest ────────────────────────────────────────────────────────────
    # GoogleTest is host-only (compiled with system g++), so its cache key does
    # not need the RISC-V toolchain commit — only runner OS and a manual version.
    - name: Restore GoogleTest cache
      id: gtest_cache
      uses: actions/cache@v4
      with:
        path: ~/googletest-install
        key: googletest-${{ runner.os }}-v1

    - name: Build GoogleTest
      if: steps.gtest_cache.outputs.cache-hit != 'true'
      run: |
        cd "$HOME"
        git clone --depth 1 https://github.com/google/googletest.git
        cd googletest
        mkdir build && cd build
        cmake .. \
          -DCMAKE_INSTALL_PREFIX="$HOME/googletest-install" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        make install

    - name: Verify GoogleTest
      run: |
        test -f "$HOME/googletest-install/lib/libgtest.a"
        test -f "$HOME/googletest-install/include/gtest/gtest.h"
        echo "GoogleTest OK"

    # ── Python packages ───────────────────────────────────────────────────────
    - name: Install Python packages
      run: |
        python3 -m pip install --break-system-packages numpy matplotlib

    # ── Host-side GoogleTest suite ────────────────────────────────────────────
    - name: Run host-side tests (make test)
      run: make test

    # ── Cross-compile pipeline ────────────────────────────────────────────────
    - name: Cross-compile RISC-V pipeline (make canny_rv)
      run: make canny_rv

    # ── RVV equivalence tests on QEMU ─────────────────────────────────────────
    - name: Build RVV equivalence test binary
      run: |
        make $(BLD_RV)/test_rvv_equiv || \
        make -f Makefile build/riscv/test_rvv_equiv || \
        ( \
          riscv64-unknown-elf-g++ \
            -std=c++17 -Wall -Wextra -O2 -march=rv64gcv -mabi=lp64d -static \
            -Iinclude \
            src/img_io.cpp src/gaussian.cpp src/sobel.cpp \
            src/mag_dir.cpp tests/test_rvv_equiv.cpp \
            -o build/riscv/test_rvv_equiv \
        )

    - name: RVV equivalence test — VLEN=128
      run: qemu-riscv64 -cpu rv64,v=true,vlen=128 build/riscv/test_rvv_equiv

    - name: RVV equivalence test — VLEN=256
      run: qemu-riscv64 -cpu rv64,v=true,vlen=256 build/riscv/test_rvv_equiv

    - name: RVV equivalence test — VLEN=512
      run: qemu-riscv64 -cpu rv64,v=true,vlen=512 build/riscv/test_rvv_equiv

    # ── Optimization sweep ────────────────────────────────────────────────────
    - name: Optimization sweep (make sweep)
      run: make sweep W=256 H=256 I=2 VLEN=256

    # ── Upload artifacts ──────────────────────────────────────────────────────
    - name: Upload bench results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bench-results-${{ github.sha }}
        path: docs/bench_results.txt
        retention-days: 30

# ==============================================================================
#  JOB 2 — verify-env
#  Runs on your self-hosted WSL2 machine (label: riscv-dev).
#  Calls scripts/verify.sh which checks the full local environment.
#  Only on push — not PRs, since your machine may be offline.
# ==============================================================================
  verify-env:
    name: Verify Local Environment (riscv-dev)
    runs-on: [self-hosted, riscv-dev]
    if: github.event_name == 'push'
    timeout-minutes: 10

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run environment verification
      run: |
        chmod +x scripts/verify.sh
        ./scripts/verify.sh