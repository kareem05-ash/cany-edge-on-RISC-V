# ==============================================================================
#  .github/workflows/ci.yml
#  Canny Edge Detection on RISC-V — CI Pipeline
#
#  Trigger policy
#  ──────────────
#  Job 1 (build-and-test) runs on:
#    • Every push to any branch        → validates work in progress immediately
#    • Every pull request into main    → required gate before merge
#
#  Job 2 (verify-env) runs on:
#    • Same as Job 1 (every push + every PR into main)
#    • continue-on-error: true + short timeout → workflow passes if WSL2
#      machine is offline; a skipped Job 2 is never a merge blocker
#
#  Cache strategy
#  ──────────────
#  The toolchain cache is keyed on:
#    riscv-toolchain-<runner.os>-<upstream-HEAD-12char>-v1
#
#  GitHub cache scoping rule (default branch = main):
#    • Pushes to main      → save cache under main (the authoritative copy)
#    • Pushes to any branch → restore-keys prefix match finds main's cache
#    • PRs into main        → exact key match finds main's cache directly
#
#  Result: the 60-90 min toolchain build happens exactly once — on the first
#  push that lands on main with a new toolchain commit. Every other run
#  (any branch, any PR) reads the main cache and skips the build entirely.
#
#  To force a clean toolchain rebuild (e.g. after changing configure flags):
#    bump the trailing -v<N> suffix in the cache key below.
#
#  Jobs
#  ────
#  [1] build-and-test  (GitHub-hosted ubuntu-latest)
#        • Install system dependencies + QEMU
#        • Restore or build RISC-V GNU toolchain (rv64gcv, lp64d)
#        • Restore or build GoogleTest
#        • Run host-side GoogleTest suite        (make test)
#        • Cross-compile full pipeline           (make canny_rv)
#        • RVV equivalence tests on QEMU         (VLEN = 128 / 256 / 512)
#        • Optimization sweep on QEMU            (256×256, VLEN=256)
#        • Upload bench results as artifact
#
#  [2] verify-env  (self-hosted runner: riscv-dev — WSL2 machine)
#        • Run scripts/verify.sh
#        • Checks toolchain, QEMU, GoogleTest, Python, RVV smoke test
#        • Skipped gracefully if machine is offline (continue-on-error: true)
#
# ==============================================================================

name: CI

on:
  push:
    branches:
      - '**'          # every push to every branch
  pull_request:
    branches:
      - main          # every PR targeting main

# Cancel in-progress runs on the same branch/PR when a new commit arrives.
# Prevents stacking 90-min toolchain builds when pushing multiple commits quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ==============================================================================
#  JOB 1 — build-and-test
# ==============================================================================
jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120    # covers the cold-cache toolchain build (~60-90 min)

    steps:

    # ── Checkout ──────────────────────────────────────────────────────────────
    - name: Checkout repository
      uses: actions/checkout@v4

    # ── System dependencies ───────────────────────────────────────────────────
    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          autoconf automake build-essential bison flex texinfo gperf libtool \
          patchutils bc git cmake ninja-build pkg-config \
          libglib2.0-dev libpixman-1-dev libslirp-dev \
          libmpc-dev libmpfr-dev libgmp-dev zlib1g-dev libexpat1-dev \
          qemu-user-static \
          python3 python3-pip

    # ── QEMU symlink ──────────────────────────────────────────────────────────
    # qemu-user-static installs the binary as qemu-riscv64-static.
    # The Makefile and test steps call it as qemu-riscv64, so we symlink once.
    - name: Expose qemu-riscv64 on PATH
      run: |
        if command -v qemu-riscv64-static &>/dev/null && \
           ! command -v qemu-riscv64 &>/dev/null; then
          sudo ln -s "$(which qemu-riscv64-static)" /usr/local/bin/qemu-riscv64
        fi
        qemu-riscv64 --version

    # ── Resolve toolchain cache key ───────────────────────────────────────────
    # Fetch the upstream riscv-gnu-toolchain HEAD commit (first 12 chars).
    # This makes the cache key content-aware: when riscv-collab merges new
    # GCC/binutils commits the key changes automatically and a fresh build
    # is triggered — no manual bump needed for upstream changes.
    - name: Resolve riscv-gnu-toolchain HEAD commit
      id: tc_commit
      run: |
        COMMIT=$(git ls-remote \
          https://github.com/riscv-collab/riscv-gnu-toolchain HEAD \
          | cut -f1 | cut -c1-12)
        echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"
        echo "Upstream toolchain HEAD: $COMMIT"

    # ── Restore toolchain cache ───────────────────────────────────────────────
    # Exact key:    riscv-toolchain-Linux-<commit>-v1
    #   → hits when this branch has already built and saved this exact toolchain
    #   → always hits on main after the first push that saved it
    #
    # restore-keys: riscv-toolchain-Linux-
    #   → prefix fallback: finds main's cache when the exact key is absent
    #   → used by: new feature branches on first push, new PRs before any push
    #   → cache-hit will be 'false' on a prefix match (see build step below)
    - name: Restore toolchain cache
      id: tc_cache
      uses: actions/cache@v4
      with:
        path: ~/riscv-toolchain
        key: riscv-toolchain-${{ runner.os }}-${{ steps.tc_commit.outputs.sha }}-v1
        restore-keys: |
          riscv-toolchain-${{ runner.os }}-

    # ── Diagnose cache state ──────────────────────────────────────────────────
    # Runs unconditionally — gives observable evidence on every run so cache
    # issues are diagnosable in seconds rather than by guessing.
    - name: Diagnose toolchain cache state
      run: |
        echo "cache-hit=${{ steps.tc_cache.outputs.cache-hit }}"
        echo "cache-key=riscv-toolchain-${{ runner.os }}-${{ steps.tc_commit.outputs.sha }}-v1"
        if [ -d "$HOME/riscv-toolchain/bin" ]; then
          echo "Toolchain bin/ present"
          du -sh "$HOME/riscv-toolchain"
          "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-g++" --version || \
            echo "WARNING: binary present but --version failed"
        else
          echo "Toolchain bin/ absent — build step will run"
        fi

    # ── Build toolchain ───────────────────────────────────────────────────────
    # Runs when:
    #   (a) cache-hit is not 'true'  — covers both a full miss and a prefix match
    # AND
    #   (b) the g++ binary is not executable — defends against a corrupt or
    #       partial cache that was saved from a previously failed build
    #
    # When a prefix-match restore landed (case a, binary intact from case b check):
    #   the binary exists → the inner guard exits 0 immediately → no rebuild.
    #
    # When a full miss (no cache at all):
    #   binary absent → full clone + configure + make.
    - name: Build RISC-V GNU toolchain from source
      if: steps.tc_cache.outputs.cache-hit != 'true'
      run: |
        if [ -x "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-g++" ]; then
          echo "Usable toolchain restored via restore-keys fallback — skipping build"
          exit 0
        fi

        echo "No usable toolchain found — building from source"
        rm -rf "$HOME/riscv-toolchain" "$HOME/riscv-gnu-toolchain"

        git clone --depth 1 --recursive --shallow-submodules \
          https://github.com/riscv-collab/riscv-gnu-toolchain \
          "$HOME/riscv-gnu-toolchain"

        cd "$HOME/riscv-gnu-toolchain"
        ./configure \
          --prefix="$HOME/riscv-toolchain" \
          --with-arch=rv64gcv \
          --with-abi=lp64d
        make -j$(nproc)

    # ── Add toolchain to PATH ─────────────────────────────────────────────────
    - name: Add toolchain to PATH
      run: echo "$HOME/riscv-toolchain/bin" >> "$GITHUB_PATH"

    # ── Verify toolchain ──────────────────────────────────────────────────────
    # Mandatory gate — runs whether toolchain was just built or restored.
    # Fails immediately with a clear message if the binary is missing or broken,
    # rather than propagating a broken toolchain into the test steps.
    - name: Verify toolchain
      run: |
        if [ ! -x "$HOME/riscv-toolchain/bin/riscv64-unknown-elf-g++" ]; then
          echo "ERROR: toolchain binary missing after build/restore"
          echo "Likely cause: build step failed or cache was saved incomplete"
          echo "Fix: bump the version suffix in the cache key (-v1 to -v2)"
          exit 1
        fi
        riscv64-unknown-elf-g++ --version
        echo "int main(){return 0;}" > /tmp/tc_check.cpp
        riscv64-unknown-elf-g++ -march=rv64gcv -mabi=lp64d -static \
          /tmp/tc_check.cpp -o /tmp/tc_check
        file /tmp/tc_check
        echo "Toolchain OK"

    # ── GoogleTest ────────────────────────────────────────────────────────────
    # Host-only (compiled with system g++). Cache key needs only runner OS
    # and a manual version — no toolchain commit dependency.
    - name: Restore GoogleTest cache
      id: gtest_cache
      uses: actions/cache@v4
      with:
        path: ~/googletest-install
        key: googletest-${{ runner.os }}-v1

    - name: Build GoogleTest
      if: steps.gtest_cache.outputs.cache-hit != 'true'
      run: |
        cd "$HOME"
        git clone --depth 1 https://github.com/google/googletest.git
        cd googletest && mkdir build && cd build
        cmake .. \
          -DCMAKE_INSTALL_PREFIX="$HOME/googletest-install" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF
        make -j$(nproc)
        make install

    - name: Verify GoogleTest
      run: |
        test -f "$HOME/googletest-install/lib/libgtest.a"
        test -f "$HOME/googletest-install/include/gtest/gtest.h"
        echo "GoogleTest OK"

    # ── Python packages ───────────────────────────────────────────────────────
    - name: Install Python packages
      run: python3 -m pip install --break-system-packages numpy matplotlib

    # ── Host-side tests ───────────────────────────────────────────────────────
    - name: Run host-side GoogleTest suite (make test)
      run: make test

    # ── Cross-compile ─────────────────────────────────────────────────────────
    - name: Cross-compile RISC-V pipeline (make canny_rv)
      run: make canny_rv

    # ── RVV equivalence tests ─────────────────────────────────────────────────
    - name: Build RVV equivalence test binary
      run: |
        make build/riscv/test_rvv_equiv || \
        ( \
          riscv64-unknown-elf-g++ \
            -std=c++17 -Wall -Wextra -O2 -march=rv64gcv -mabi=lp64d -static \
            -Iinclude \
            src/img_io.cpp src/gaussian.cpp src/sobel.cpp \
            src/mag_dir.cpp src/mag_dir_rvv.cpp \
            tools/cpp/gen_imgs.cpp \
            src/gaussian_rvv.cpp src/sobel_rvv.cpp \
            tests/integ/test_rvv_equiv.cpp \
            -o build/riscv/test_rvv_equiv \
        )

    - name: RVV equivalence test — VLEN=128
      run: qemu-riscv64 -cpu rv64,v=true,vlen=128 build/riscv/test_rvv_equiv

    - name: RVV equivalence test — VLEN=256
      run: qemu-riscv64 -cpu rv64,v=true,vlen=256 build/riscv/test_rvv_equiv

    - name: RVV equivalence test — VLEN=512
      run: qemu-riscv64 -cpu rv64,v=true,vlen=512 build/riscv/test_rvv_equiv

    # ── VLEN sweep correctness (vector-length-agnostic proof) ────────────────
    - name: Build VLEN sweep correctness binary
      run: make build/riscv/test_vlen_sweep

    - name: VLEN sweep correctness test — VLEN=128
      run: qemu-riscv64 -cpu rv64,v=true,vlen=128 build/riscv/test_vlen_sweep

    - name: VLEN sweep correctness test — VLEN=256
      run: qemu-riscv64 -cpu rv64,v=true,vlen=256 build/riscv/test_vlen_sweep

    - name: VLEN sweep correctness test — VLEN=512
      run: qemu-riscv64 -cpu rv64,v=true,vlen=512 build/riscv/test_vlen_sweep

    # ── Optimization sweep ────────────────────────────────────────────────────
    # 256×256 intentionally — keeps CI fast. Use 512×512 locally.
    - name: Optimization sweep (make sweep)
      run: make sweep W=256 H=256 I=2 VLEN=256

    # ── Upload artifacts ──────────────────────────────────────────────────────
    - name: Upload bench results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bench-results-${{ github.sha }}
        path: docs/bench_results.txt
        retention-days: 30

    # ── Python visualization smoke test ──────────────────────────────────────
    # Runs plot_all.py --phase 6 with dummy/absent data files.
    # Must not crash — graceful skip on missing files is the contract.
    - name: Python plot smoke test (Phase 6)
      run: |
        python3 -m pip install --break-system-packages matplotlib numpy
        python3 tools/python/plot_all.py --phase 6 --out-dir /tmp/plots
        echo "Plots written:"
        ls -lh /tmp/plots/*.png 2>/dev/null || echo "(no plots — all data files absent, skip is correct)"

# ==============================================================================
#  JOB 2 — verify-env
#  Self-hosted WSL2 machine (riscv-dev).
#  continue-on-error: true — workflow passes even if machine is offline.
#  timeout-minutes: 10     — if the runner never picks up the job (offline),
#                            it fails after 10 min rather than blocking forever.
# ==============================================================================
  verify-env:
    name: Verify Local Environment (riscv-dev)
    runs-on: [self-hosted, riscv-dev]
    continue-on-error: true
    timeout-minutes: 10

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run environment verification
      run: |
        chmod +x scripts/verify.sh
        ./scripts/verify.sh